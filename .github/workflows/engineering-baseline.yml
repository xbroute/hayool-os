name: engineering-candidate

on:
  pull_request:

permissions:
  contents: read

jobs:
  engineering-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-26
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load policy from PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:bootstrap/baseline.py"; then
            git show "$BASE_SHA:bootstrap/baseline.py" > "$RUNNER_TEMP/trusted-baseline.py"
            echo "HAYOOL_POLICY_SOURCE=base" >> "$GITHUB_ENV"
          else
            cp bootstrap/baseline.py "$RUNNER_TEMP/trusted-baseline.py"
            echo "HAYOOL_POLICY_SOURCE=bootstrap-exception" >> "$GITHUB_ENV"
          fi
      - name: Run deterministic M0 checks on PR head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          HAYOOL_CANDIDATE_ROOT: ${{ github.workspace }}
        run: python3 -I "$RUNNER_TEMP/trusted-baseline.py" --base-sha "$BASE_SHA" --target-sha "$TARGET_SHA" --output "$RUNNER_TEMP/baseline.json"
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-09-26
        with:
          name: engineering-baseline-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/baseline.json
          if-no-files-found: error
          retention-days: 30
      - name: Run boundary regression in separate unprivileged step
        run: python3 -I -m unittest discover -s bootstrap/regression_tests -p 'test_*.py' -v
